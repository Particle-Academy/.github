name: CI

# This repo holds the suite's third-party allowlist and the checker that
# enforces it, so its own tests are the thing standing between a bad edit here
# and a bad gate in ~50 other repos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No install step and no lockfile on purpose: the checker is written
      # against the Node standard library and has no dependencies. A tool that
      # polices third-party code and carries its own would be a joke at its own
      # expense, and this is what keeps that true.
      - name: Assert the checker has no dependencies
        run: |
          if [ -f third-party/package.json ]; then
            echo "::error::third-party/ must not have a package.json. The checker takes no dependencies."
            exit 1
          fi

      # This also guards the allowlist itself: the checker reads it at runtime,
      # so a malformed one would fail every repo in the suite at once.
      # check.test.mjs loads the SHIPPED allowlist.json and asserts it parses,
      # matches the schema version and gives every entry a reason. There used to
      # be a separate `check.mjs --repo .` step for this; it went red on
      # 2026-10-27 once the checker refused manifest-less trees (no-manifest),
      # because this repo has no manifest, and never checked more than the
      # tests already do.
      - name: Test
        run: node --test "third-party/*.test.mjs"
